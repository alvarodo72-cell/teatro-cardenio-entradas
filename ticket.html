<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verificación de entrada · Teatro Cardenio</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#101827,#7b1d1d);color:#101827;display:flex;align-items:center;justify-content:center;padding:22px}.card{width:min(720px,96vw);background:#fff;border-radius:28px;box-shadow:0 30px 90px rgba(0,0,0,.35);overflow:hidden}.head{background:#7b1d1d;color:#fff;padding:24px 28px}.head h1{margin:0;font-size:30px}.head p{margin:8px 0 0;color:#fee2e2}.body{padding:26px}.status{display:inline-block;border-radius:999px;padding:10px 16px;font-weight:950;margin-bottom:18px}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.warn{background:#fef3c7;color:#92400e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:18px;padding:15px}.item span{display:block;color:#64748b;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:950;margin-bottom:5px}.item strong{font-size:18px}.full{grid-column:1/-1}.footer{padding:18px 26px;background:#f8fafc;color:#64748b;font-size:13px}.loader{color:#fff;text-align:center;font-weight:900}.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:14px;background:#7b1d1d;color:#fff;padding:12px 16px;font-weight:950;cursor:pointer}.btn.secondary{background:#e2e8f0;color:#334155}@media(max-width:680px){.grid{grid-template-columns:1fr}.head h1{font-size:25px}}
  </style>
</head>
<body>
  <div id="mount" class="loader">Comprobando entrada...</div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    const mount = document.getElementById('mount');
    const token = new URLSearchParams(location.search).get('token');
    function renderError(title, message) {
      mount.className = 'card';
      mount.innerHTML = `<div class="head"><h1>${title}</h1><p>Teatro Cardenio · Carnaval</p></div><div class="body"><span class="status bad">No válida</span><p>${message}</p></div><div class="footer">Si crees que es un error, contacta con la organización.</div>`;
    }
    function formattedEvent(event) {
      if (!event) return 'Función no indicada';
      const date = event.fecha ? new Date(event.fecha + 'T00:00:00').toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long', year:'numeric' }) : '';
      const time = event.hora ? String(event.hora).slice(0,5) : '';
      return `${event.nombre || 'Función'} · ${date} · ${time}`;
    }
    async function verifyTicket() {
      if (!token) return renderError('QR sin token', 'El código QR no contiene un token de entrada válido.');
      const { data: ticket, error } = await window.sb.from('tickets').select('*, seats(*), orders(*, events(*))').eq('qr_token', token).maybeSingle();
      if (error) { console.error(error); return renderError('Error de verificación', 'No se pudo consultar la entrada en este momento.'); }
      if (!ticket) return renderError('Entrada no encontrada', 'El token escaneado no corresponde a ninguna entrada registrada.');
      const order = ticket.orders || {}, event = order.events || {}, seat = ticket.seats || {};
      const isGenerated = ticket.estado === 'generada', isUsed = ticket.estado === 'usada', isCancelled = ticket.estado === 'cancelada';
      const statusClass = isGenerated ? 'ok' : isUsed ? 'warn' : 'bad';
      const statusText = isGenerated ? 'Entrada confirmada' : isUsed ? 'Entrada ya utilizada' : isCancelled ? 'Entrada cancelada' : 'Entrada pendiente';
      mount.className = 'card';
      mount.innerHTML = `<div class="head"><h1>${isGenerated ? '✅ ENTRADA CONFIRMADA' : isUsed ? '⚠️ ENTRADA YA UTILIZADA' : '❌ ENTRADA NO VÁLIDA'}</h1><p>Teatro Cardenio · Carnaval</p></div><div class="body"><span class="status ${statusClass}">${statusText}</span><div class="grid"><div class="item full"><span>Función</span><strong>${formattedEvent(event)}</strong></div><div class="item full"><span>Nombre y apellidos</span><strong>${ticket.nombre} ${ticket.apellidos}</strong></div><div class="item"><span>DNI</span><strong>${ticket.dni}</strong></div><div class="item"><span>Nº entrada</span><strong>${ticket.numero_entrada}</strong></div><div class="item"><span>Zona</span><strong>${seat.zona || ''}</strong></div><div class="item"><span>Fila / Plaza</span><strong>${seat.fila || ''}</strong></div><div class="item"><span>Butaca</span><strong>${seat.butaca || ''}</strong></div><div class="item"><span>Pedido</span><strong>${order.numero_pedido || ''}</strong></div></div><div class="actions"><button class="btn" onclick="location.reload()">Volver a comprobar</button><button class="btn secondary" onclick="history.back()">Volver</button></div></div><div class="footer">Verificación online conectada a Supabase.</div>`;
    }
    verifyTicket();
  </script>
</body>
</html>
