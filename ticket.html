<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación de entrada · Teatro Cardenio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #7b1d1d 100%);
      color: #1a2332;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: min(680px, 96vw);
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.35);
      overflow: hidden;
      animation: cardIn 0.4s ease;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .head {
      background: linear-gradient(135deg, #7b1d1d, #991b1b);
      color: #fff;
      padding: 28px 32px;
      position: relative;
      overflow: hidden;
    }
    .head::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 200px;
      height: 200px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
    }
    .head h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .head p {
      margin: 8px 0 0;
      color: #fecaca;
      font-size: 14px;
    }
    .body { padding: 28px 32px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .ok {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .bad {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .warn {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px;
      transition: box-shadow 0.2s ease;
    }
    .item:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .item span {
      display: block;
      color: #64748b;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .item strong {
      font-size: 16px;
      font-weight: 700;
    }
    .full { grid-column: 1 / -1; }
    .footer {
      padding: 16px 32px;
      background: #f8fafc;
      color: #94a3b8;
      font-size: 12px;
      border-top: 1px solid #e2e8f0;
    }
    .loader {
      color: #fff;
      text-align: center;
      font-weight: 700;
      font-size: 16px;
      padding: 60px;
    }
    .loader::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #7b1d1d, #991b1b);
      color: #fff;
      padding: 12px 20px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(123,29,29,0.3);
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(123,29,29,0.4);
    }
    .btn.secondary {
      background: #f1f5f9;
      color: #475569;
      box-shadow: none;
    }
    .btn.secondary:hover {
      background: #e2e8f0;
    }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
      .head h1 { font-size: 22px; }
      .body { padding: 20px; }
      .head { padding: 20px; }
    }
  </style>
</head>
<body>
  <div id="mount" class="loader">Comprobando entrada...</div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    const mount = document.getElementById('mount');
    const token = new URLSearchParams(location.search).get('token');

    function renderError(title, message) {
      mount.className = 'card';
      mount.innerHTML = `
        <div class="head"><h1>${title}</h1><p>Teatro Cardenio · Carnaval</p></div>
        <div class="body">
          <span class="status bad">No válida</span>
          <p>${message}</p>
        </div>
        <div class="footer">Si crees que es un error, contacta con la organización.</div>`;
    }

    function formattedEvent(event) {
      if (!event) return 'Función no indicada';
      const date = event.fecha
        ? new Date(event.fecha + 'T00:00:00').toLocaleDateString('es-ES', {
            weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
          })
        : '';
      const time = event.hora ? String(event.hora).slice(0, 5) : '';
      return `${event.nombre || 'Función'} · ${date} · ${time}`;
    }

    async function verifyTicket() {
      if (!token)
        return renderError('QR sin token', 'El código QR no contiene un token de entrada válido.');

      const { data: ticket, error } = await window.sb
        .from('tickets')
        .select('*, seats(*), orders(*, events(*))')
        .eq('qr_token', token)
        .maybeSingle();

      if (error) {
        console.error(error);
        return renderError('Error de verificación', 'No se pudo consultar la entrada en este momento.');
      }

      if (!ticket)
        return renderError('Entrada no encontrada', 'El token escaneado no corresponde a ninguna entrada registrada.');

      const order = ticket.orders || {};
      const event = order.events || {};
      const seat = ticket.seats || {};

      const isGenerated = ticket.estado === 'generada';
      const isUsed = ticket.estado === 'usada';
      const isCancelled = ticket.estado === 'cancelada';

      const statusClass = isGenerated ? 'ok' : isUsed ? 'warn' : 'bad';
      const statusText = isGenerated ? 'Entrada confirmada' : isUsed ? 'Entrada ya utilizada' : isCancelled ? 'Entrada cancelada' : 'Entrada pendiente';

      mount.className = 'card';
      mount.innerHTML = `
        <div class="head">
          <h1>${isGenerated ? '✅ ENTRADA CONFIRMADA' : isUsed ? '⚠️ ENTRADA YA UTILIZADA' : '❌ ENTRADA NO VÁLIDA'}</h1>
          <p>Teatro Cardenio · Carnaval</p>
        </div>
        <div class="body">
          <span class="status ${statusClass}">${statusText}</span>
          <div class="grid">
            <div class="item full">
              <span>Función</span>
              <strong>${formattedEvent(event)}</strong>
            </div>
            <div class="item full">
              <span>Nombre y apellidos</span>
              <strong>${ticket.nombre} ${ticket.apellidos}</strong>
            </div>
            <div class="item">
              <span>DNI</span>
              <strong>${ticket.dni}</strong>
            </div>
            <div class="item">
              <span>Nº entrada</span>
              <strong>${ticket.numero_entrada}</strong>
            </div>
            <div class="item">
              <span>Zona</span>
              <strong>${seat.zona || ''}</strong>
            </div>
            <div class="item">
              <span>Fila / Plaza</span>
              <strong>${seat.fila || ''}</strong>
            </div>
            <div class="item">
              <span>Butaca</span>
              <strong>${seat.butaca || ''}</strong>
            </div>
            <div class="item">
              <span>Pedido</span>
              <strong>${order.numero_pedido || ''}</strong>
            </div>
          </div>
          <div class="actions">
            <button class="btn" onclick="location.reload()">Volver a comprobar</button>
            <button class="btn secondary" onclick="history.back()">Volver</button>
          </div>
        </div>
        <div class="footer">Verificación online conectada a Supabase.</div>`;
    }

    verifyTicket();
  </script>
</body>
</html>
