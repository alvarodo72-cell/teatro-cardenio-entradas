<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin | Entrada integrada</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><div class="brand"><div class="logo">🎭</div><div><strong>Panel administrador</strong><small>Entradas integradas</small></div></div><div class="topRight"><label>Función</label><select id="eventId"></select><button id="logoutAdmin">Salir</button></div></header>
<main class="adminGrid"><nav class="adminNav"><button data-tab="dashboard" class="active">📊 Dashboard</button><button data-tab="eventos">📅 Eventos</button><button data-tab="compras">🧾 Compras</button><button data-tab="bizum">📲 Bizum</button><button data-tab="buscar">🔎 Buscar</button><a href="index.html">← Volver</a></nav><section class="adminContent"><div id="dashboard" class="tab active"><div class="dash"><div class="kpi"><span>Vendidas</span><strong id="kSold">0</strong></div><div class="kpi"><span>Pendientes</span><strong id="kPending">0</strong></div><div class="kpi"><span>Recaudación</span><strong id="kRevenue">0 €</strong></div></div><section class="card"><h2>Resumen</h2><p id="adminEventText"></p></section></div><div id="eventos" class="tab"><section class="card"><h2>Crear función</h2><div class="eventForm"><label>Nombre<input id="newEventName" placeholder="Carnaval Adultos"></label><label>Fecha<input id="newEventDate" type="date"></label><label>Hora<input id="newEventTime" type="time"></label><label>Estado<select id="newEventStatus"><option value="activo">Activo</option><option value="oculto">Oculto</option><option value="cerrado">Ventas cerradas</option></select></label><button id="createEventBtn" class="danger">Crear</button></div><h3>Funciones</h3><div id="eventsList"></div></section></div><div id="compras" class="tab"><section class="card"><h2>Compras</h2><table class="table" id="ordersTable"></table></section></div><div id="bizum" class="tab"><section class="card"><h2>Pendientes Bizum</h2><div id="pendingBizum"></div></section></div><div id="buscar" class="tab"><section class="card"><h2>Buscar entrada</h2><div class="toolbar"><input id="searchInput" placeholder="DNI, nombre, pedido, entrada"><button id="searchBtn" class="danger">Buscar</button></div><div id="searchResults"></div></section></div></section></main>
<div id="ticketOverlay" class="overlay hidden"><div class="modal ticketsModal"><div class="modalHead"><div><h2>Documento de entrada</h2></div><div class="ticketActions"><button id="printTickets" class="light printBtn">Imprimir / guardar PDF</button><button id="closeTickets" class="closeBtn">×</button></div></div><div id="ticketsList"></div></div></div>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="js/supabaseClient.js"></script><script src="js/data.js"></script><script src="js/ticketDocument.js"></script><script src="admin.js"></script></body></html>
