<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Validar entrada · Teatro Cardenio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #fff;
      overflow: hidden;
      position: fixed;
      width: 100%;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }
    .header {
      background: linear-gradient(135deg, #7b1d1d, #991b1b);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }
    .header img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
    }
    .header .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }
    .header .status-dot.offline { background: #ef4444; animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .scanner-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #qr-reader {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #qr-reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }
    .scan-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 5;
    }
    .scan-frame {
      width: 260px;
      height: 260px;
      border: 3px solid rgba(255,255,255,0.8);
      border-radius: 24px;
      position: relative;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
    }
    .scan-frame::before {
      content: '';
      position: absolute;
      inset: -6px;
      border: 3px solid #22c55e;
      border-radius: 28px;
      animation: scanPulse 2s ease-in-out infinite;
    }
    @keyframes scanPulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    .scan-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      z-index: 6;
    }
    .result-panel {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: none;
      flex-direction: column;
      animation: resultIn 0.3s ease;
    }
    .result-panel.show { display: flex; }
    @keyframes resultIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .result-panel.valid {
      background: linear-gradient(135deg, #065f46, #047857);
    }
    .result-panel.invalid {
      background: linear-gradient(135deg, #991b1b, #b91c1c);
    }
    .result-panel.used {
      background: linear-gradient(135deg, #92400e, #b45309);
    }
    .result-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      gap: 16px;
    }
    .result-icon {
      font-size: 72px;
      line-height: 1;
    }
    .result-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .result-subtitle {
      font-size: 14px;
      opacity: 0.8;
    }
    .result-info {
      background: rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 16px 20px;
      width: 100%;
      max-width: 340px;
      text-align: left;
    }
    .result-info-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 13px;
    }
    .result-info-row:last-child { border-bottom: none; }
    .result-info-row span { opacity: 0.7; }
    .result-info-row strong { font-weight: 700; }
    .result-actions {
      padding: 16px 20px 32px;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    .result-btn {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .result-btn:active { transform: scale(0.97); }
    .result-btn.primary {
      background: #fff;
      color: #065f46;
    }
    .result-btn.secondary {
      background: rgba(255,255,255,0.2);
      color: #fff;
    }
    .no-camera {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
      gap: 16px;
    }
    .no-camera .icon { font-size: 48px; }
    .no-camera h2 { font-size: 20px; }
    .no-camera p { font-size: 14px; opacity: 0.7; }
    .manual-input {
      padding: 16px 20px;
      background: rgba(255,255,255,0.1);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .manual-input input {
      flex: 1;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      background: rgba(0,0,0,0.3);
      color: #fff;
      outline: none;
    }
    .manual-input input::placeholder { color: rgba(255,255,255,0.4); }
    .manual-input input:focus { border-color: #22c55e; }
    .manual-input button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      background: #22c55e;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .flash {
      position: absolute;
      inset: 0;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
    .flash.show { opacity: 1; }
    .flash.green { background: rgba(34,197,94,0.4); }
    .flash.red { background: rgba(239,68,68,0.4); }
    .flash.orange { background: rgba(245,158,11,0.4); }
    .sound-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="header">
      <div style="display:flex;align-items:center;gap:12px;">
        <img src="logo%20(2).jpeg" alt="ACA">
        <h1>Validar entradas</h1>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="sound-btn" id="soundToggle" title="Sonido">🔊</button>
        <div class="status-dot" id="statusDot"></div>
      </div>
    </div>
    <div class="scanner-wrap" id="scannerWrap">
      <div id="qr-reader"></div>
      <div class="scan-overlay">
        <div class="scan-frame"></div>
      </div>
      <div class="scan-hint">Apunta al código QR</div>
      <div class="flash" id="flash"></div>
      <div class="result-panel" id="resultPanel">
        <div class="result-content">
          <div class="result-icon" id="resultIcon"></div>
          <div class="result-title" id="resultTitle"></div>
          <div class="result-subtitle" id="resultSubtitle"></div>
          <div class="result-info" id="resultInfo"></div>
        </div>
        <div class="result-actions">
          <button class="result-btn secondary" id="btnCancel" onclick="closeResult()">Cancelar</button>
          <button class="result-btn primary" id="btnConfirm" onclick="confirmValidation()">Confirmar entrada</button>
        </div>
      </div>
    </div>
    <div class="manual-input">
      <input type="text" id="manualInput" placeholder="Escribe el token manualmente..." autocomplete="off">
      <button id="manualBtn">Validar</button>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    let qrScanner = null;
    let soundEnabled = true;
    let currentTicket = null;
    let scanning = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, duration, count = 1) {
      if (!soundEnabled) return;
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.frequency.value = freq;
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);
          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + duration / 1000);
        }, i * (duration + 80));
      }
    }

    function flashScreen(color) {
      const el = document.getElementById('flash');
      el.className = 'flash show ' + color;
      setTimeout(() => el.className = 'flash', 400);
    }

    document.getElementById('soundToggle').onclick = () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
    };

    async function validateToken(token) {
      if (!token || scanning) return;
      scanning = true;
      playBeep(800, 100);

      const { data: ticket, error } = await window.sb
        .from('tickets')
        .select('*, seats(*), orders(*, events(*))')
        .eq('qr_token', token)
        .maybeSingle();

      if (error || !ticket) {
        flashScreen('red');
        playBeep(300, 300, 3);
        showResult('invalid', {
          icon: '❌',
          title: 'Entrada no válida',
          subtitle: 'Este código QR no corresponde a ninguna entrada registrada.',
          info: null
        });
        scanning = false;
        return;
      }

      currentTicket = ticket;

      if (ticket.estado === 'usada') {
        flashScreen('orange');
        playBeep(500, 200, 2);
        const order = ticket.orders || {};
        showResult('used', {
          icon: '⚠️',
          title: 'Entrada ya utilizada',
          subtitle: 'Esta entrada ya ha sido escaneada anteriormente.',
          info: [
            ['Nombre', ticket.nombre + ' ' + ticket.apellidos],
            ['DNI', ticket.dni],
            ['Nº entrada', ticket.numero_entrada],
            ['Zona', ticket.seats?.zona || ''],
            ['Butaca', `F${ticket.seats?.fila || ''} · B${ticket.seats?.butaca || ''}`]
          ]
        });
        scanning = false;
        return;
      }

      if (ticket.estado === 'cancelada') {
        flashScreen('red');
        playBeep(300, 300, 3);
        showResult('invalid', {
          icon: '🚫',
          title: 'Entrada cancelada',
          subtitle: 'Esta entrada ha sido cancelada.',
          info: [
            ['Nombre', ticket.nombre + ' ' + ticket.apellidos],
            ['DNI', ticket.dni],
            ['Nº entrada', ticket.numero_entrada]
          ]
        });
        scanning = false;
        return;
      }

      flashScreen('green');
      playBeep(1200, 150, 2);
      const order = ticket.orders || {};
      const event = order.events || {};
      const seat = ticket.seats || {};
      const eventDate = event.fecha
        ? new Date(event.fecha + 'T00:00:00').toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })
        : '';
      const eventTime = event.hora ? String(event.hora).slice(0, 5) : '';

      showResult('valid', {
        icon: '✅',
        title: 'Entrada confirmada',
        subtitle: `${event.nombre || ''} · ${eventDate} ${eventTime}`,
        info: [
          ['Nombre', ticket.nombre + ' ' + ticket.apellidos],
          ['DNI', ticket.dni],
          ['Nº entrada', ticket.numero_entrada],
          ['Zona', seat.zona || ''],
          ['Fila / Butaca', `F${seat.fila || ''} · B${seat.butaca || ''}`],
          ['Pedido', order.numero_pedido || '']
        ]
      });
      scanning = false;
    }

    async function confirmValidation() {
      if (!currentTicket) return;
      const btn = document.getElementById('btnConfirm');
      btn.textContent = 'Procesando...';
      btn.disabled = true;

      const { error } = await window.sb
        .from('tickets')
        .update({ estado: 'usada' })
        .eq('id', currentTicket.id);

      if (error) {
        alert('Error al marcar la entrada: ' + error.message);
        btn.textContent = 'Confirmar entrada';
        btn.disabled = false;
        return;
      }

      playBeep(1500, 100);
      closeResult();
      btn.textContent = 'Confirmar entrada';
      btn.disabled = false;
    }

    function showResult(type, data) {
      const panel = document.getElementById('resultPanel');
      panel.className = 'result-panel show ' + type;
      document.getElementById('resultIcon').textContent = data.icon;
      document.getElementById('resultTitle').textContent = data.title;
      document.getElementById('resultSubtitle').textContent = data.subtitle;

      const infoEl = document.getElementById('resultInfo');
      if (data.info && data.info.length) {
        infoEl.style.display = 'block';
        infoEl.innerHTML = data.info.map(([label, value]) =>
          `<div class="result-info-row"><span>${label}</span><strong>${value || ''}</strong></div>`
        ).join('');
      } else {
        infoEl.style.display = 'none';
      }

      const btnConfirm = document.getElementById('btnConfirm');
      if (type === 'valid') {
        btnConfirm.style.display = '';
        btnConfirm.textContent = 'Confirmar entrada';
        btnConfirm.disabled = false;
      } else {
        btnConfirm.style.display = 'none';
      }
    }

    function closeResult() {
      document.getElementById('resultPanel').className = 'result-panel';
      currentTicket = null;
    }

    function startScanner() {
      if (qrScanner) {
        qrScanner.clear();
      }
      qrScanner = new Html5Qrcode('qr-reader');
      qrScanner.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 },
          aspectRatio: 1.0
        },
        (decodedText) => {
          const url = decodedText.trim();
          let token = '';
          try {
            const u = new URL(url);
            token = u.searchParams.get('token') || url;
          } catch {
            token = url;
          }
          validateToken(token);
        },
        () => {}
      ).catch(() => {
        document.getElementById('scannerWrap').innerHTML = `
          <div class="no-camera">
            <div class="icon">📷</div>
            <h2>Cámara no disponible</h2>
            <p>Usa el campo de abajo para introducir el token manualmente.</p>
          </div>`;
      });
    }

    document.getElementById('statusDot').className = navigator.onLine ? 'status-dot' : 'status-dot offline';
    window.addEventListener('online', () => { document.getElementById('statusDot').className = 'status-dot'; });
    window.addEventListener('offline', () => { document.getElementById('statusDot').className = 'status-dot offline'; });

    document.getElementById('manualBtn').onclick = () => {
      const val = document.getElementById('manualInput').value.trim();
      if (val) validateToken(val);
    };
    document.getElementById('manualInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const val = e.target.value.trim();
        if (val) validateToken(val);
      }
    });

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      startScanner();
    } else {
      document.getElementById('scannerWrap').innerHTML = `
        <div class="no-camera">
          <div class="icon">📱</div>
          <h2>Cámara no soportada</h2>
          <p>Usa el campo de abajo para introducir el token manualmente.</p>
        </div>`;
    }
  </script>
</body>
</html>
